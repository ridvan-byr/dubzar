[project]
name = "dubzar"
version = "0.1.0"
description = "Dubzar: universal Turkish subtitles and dubbing for games"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.scripts]
dubzar = "dubzar.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
asr = ["faster-whisper>=1.0"]
ocr = ["pillow>=10", "winrt-runtime", "winrt-Windows.Media.Ocr", "winrt-Windows.Graphics.Imaging",
       "winrt-Windows.Storage.Streams", "winrt-Windows.Globalization", "winrt-Windows.Foundation",
       "winrt-Windows.Foundation.Collections"]
translate = ["transformers>=4.40", "torch", "sentencepiece", "sacremoses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real models or hardware"]
addopts = "-m 'not slow'"

[tool.setuptools]
packages = ["dubzar", "dubzar.ui"]

[tool.setuptools.package-data]
"dubzar.ui" = ["*.qml", "*.svg", "*.ico", "fonts/*"]
