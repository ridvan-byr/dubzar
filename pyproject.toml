[project]
name = "dubzar"
version = "0.1.0"
description = "Dubzar: universal Turkish subtitles and dubbing for games"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "PySide6>=6.6",
]

[project.scripts]
dubzar = "dubzar.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
asr = ["faster-whisper>=1.0"]
translate = ["transformers>=4.40", "torch", "sentencepiece", "sacremoses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real models or hardware"]
addopts = "-m 'not slow'"

[tool.setuptools]
packages = ["dubzar"]
