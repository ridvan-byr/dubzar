<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çeviri puanlama</title>
<style>
:root{--bg:#231f1b;--surface:#352F2A;--line:#4A423B;--text:#F7F5F0;--muted:#A89F94;--accent:#F2C14E;--ink:#2B2622;--ok:#7fe0b0;--minor:#F2C14E;--bad:#ff8f8f}
*{box-sizing:border-box;margin:0}body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:5}
header .row{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:900px;margin:10px auto 0}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{max-width:900px;margin:0 auto;padding:24px 20px 80px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ctx{margin-top:14px;color:var(--muted);font-size:15px}.ctx b{color:var(--text);font-weight:500}
.en{font-size:30px;font-weight:500;letter-spacing:-.01em;margin:10px 0 22px;line-height:1.25}
.grid{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tr{font-size:22px;margin:8px 0 14px;min-height:34px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--muted)}
button.on.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}button.on.minor{background:var(--minor);color:var(--ink);border-color:var(--minor)}button.on.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.why{margin-top:12px;display:none;flex-wrap:wrap;gap:6px}.why.show{display:flex}.why button{font-size:13px;padding:5px 12px}.why button.on{background:var(--line)}
.pref{margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pref span{color:var(--muted)}.pref button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.nav{display:flex;justify-content:space-between;margin-top:26px;gap:10px}.nav .primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
#result{display:none;margin-top:30px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--muted);font-weight:500;font-size:13px}
.saved{font-size:12px;color:var(--muted)}
</style></head><body>
<header><div class="row"><b>Çeviri puanlama</b><span id="count">1 / 90</span><span class="saved" id="saved"></span><button id="finish">Sonuçları göster</button></div><div class="bar"><i id="fill"></i></div></header>
<main>
 <div id="item"></div>
 <div id="result"></div>
</main>
<script>
const DATA=[{"id": 1, "category": "konusma", "context": "", "en": "I didn't think you'd actually show up.", "a": "Gerçekten geleceğini düşünmemiştim.", "b": "Gerçekten geleceğini sanmıyordum.", "a_is": "claude"}, {"id": 2, "category": "konusma", "context": "", "en": "You've got some nerve coming back here.", "a": "Buraya geri dönmeye cüret ediyorsun.", "b": "Buraya geri dönmeye cesaretin var.", "a_is": "claude"}, {"id": 3, "category": "konusma", "context": "", "en": "Tell me you're joking.", "a": "Şaka yaptığını söyle bana.", "b": "Şaka yaptığını söyle.", "a_is": "claude"}, {"id": 4, "category": "konusma", "context": "", "en": "We can't keep running forever.", "a": "Sonsuza kadar kaçamayız.", "b": "Sonsuza kadar kaçamayız.", "a_is": "claude"}, {"id": 5, "category": "konusma", "context": "", "en": "He never told me about his brother.", "a": "Bana kardeşinden hiç bahsetmedi.", "b": "Bana kardeşinden hiç bahsetmedi.", "a_is": "dubzar"}, {"id": 6, "category": "konusma", "context": "", "en": "It's been three years since I last saw her.", "a": "Onu en son gördüğümden beri üç yıl geçti.", "b": "Onu son gördüğümden beri üç yıl geçti.", "a_is": "claude"}, {"id": 7, "category": "konusma", "context": "", "en": "Do you have any idea what you've done?", "a": "Ne yaptığın hakkında bir fikrin var mı?", "b": "Ne yaptığının farkında mısın?", "a_is": "claude"}, {"id": 8, "category": "konusma", "context": "", "en": "I'll be waiting outside if you need me.", "a": "İhtiyacın olursa dışarıda bekliyor olacağım.", "b": "İhtiyacın olursa dışarıda bekliyor olacağım.", "a_is": "dubzar"}, {"id": 9, "category": "konusma", "context": "", "en": "That's the third time this week.", "a": "Bu hafta üçüncü kez oluyor.", "b": "Bu haftaki üçüncü seferi bu.", "a_is": "dubzar"}, {"id": 10, "category": "konusma", "context": "", "en": "I wouldn't touch that if I were you.", "a": "Yerinde olsam ona dokunmazdım.", "b": "Yerinde olsam ona dokunmazdım.", "a_is": "dubzar"}, {"id": 11, "category": "konusma", "context": "", "en": "She's the only one who knows the way.", "a": "Yolu bilen tek kişi o.", "b": "Yolu bilen tek kişi o.", "a_is": "claude"}, {"id": 12, "category": "konusma", "context": "", "en": "Let's not make this harder than it has to be.", "a": "Bunu olması gerekenden daha zor hale getirmeyelim.", "b": "Bunu olduğundan daha zor hâle getirmeyelim.", "a_is": "dubzar"}, {"id": 13, "category": "konusma", "context": "", "en": "You can't be serious right now.", "a": "Şu an ciddi olamazsın.", "b": "Şu anda ciddi olamazsın.", "a_is": "claude"}, {"id": 14, "category": "konusma", "context": "", "en": "I need you to trust me on this one.", "a": "Bu konuda bana güvenmeni istiyorum.", "b": "Bu konuda bana güvenmeni istiyorum.", "a_is": "claude"}, {"id": 15, "category": "konusma", "context": "", "en": "We're almost out of fuel.", "a": "Yakıtımız neredeyse bitti.", "b": "Yakıtımız bitmek üzere.", "a_is": "claude"}, {"id": 16, "category": "konusma", "context": "", "en": "I've had enough of your excuses.", "a": "Bahanelerinden bıktım artık.", "b": "Mazeretlerinden bıktım artık.", "a_is": "claude"}, {"id": 17, "category": "konusma", "context": "", "en": "He's not coming back, is he?", "a": "Geri gelmeyecek, değil mi?", "b": "Geri dönmeyecek, değil mi?", "a_is": "claude"}, {"id": 18, "category": "konusma", "context": "", "en": "Somebody must have tipped them off.", "a": "Birileri onlara haber vermiş olmalı.", "b": "Biri onları haberdar etmiş olmalı.", "a_is": "dubzar"}, {"id": 19, "category": "konusma", "context": "", "en": "Take a look at this.", "a": "Şuna bir bak.", "b": "Şuna bir bak.", "a_is": "claude"}, {"id": 20, "category": "konusma", "context": "", "en": "I never asked for any of this.", "a": "Bunların hiçbirini ben istemedim.", "b": "Bunların hiçbirini ben istemedim.", "a_is": "dubzar"}, {"id": 21, "category": "konusma", "context": "", "en": "The whole place is falling apart.", "a": "Bütün bina yıkılıyor.", "b": "Her yer dağılıyor.", "a_is": "claude"}, {"id": 22, "category": "konusma", "context": "", "en": "You were right about him all along.", "a": "Başından beri onun hakkında haklıydın.", "b": "Başından beri onun hakkında haklıydın.", "a_is": "dubzar"}, {"id": 23, "category": "konusma", "context": "", "en": "Keep your voice down, someone's coming.", "a": "Sesini kıs, biri geliyor.", "b": "Sesini alçalt, biri geliyor.", "a_is": "claude"}, {"id": 24, "category": "konusma", "context": "", "en": "How did you even get in here?", "a": "Buraya nasıl girdin?", "b": "Buraya nasıl girdin sen?", "a_is": "dubzar"}, {"id": 25, "category": "konusma", "context": "", "en": "I'd rather die than let them take her.", "a": "Onu almalarına izin vermektense ölmeyi tercih ederim.", "b": "Onu almalarına izin vermektense ölürüm.", "a_is": "dubzar"}, {"id": 26, "category": "konusma", "context": "", "en": "Just breathe. Everything's going to be fine.", "a": "Sadece nefes al. Her şey yoluna girecek.", "b": "Nefes al. Her şey yoluna girecek.", "a_is": "claude"}, {"id": 27, "category": "konusma", "context": "", "en": "We lost the signal about ten minutes ago.", "a": "Sinyali yaklaşık on dakika önce kaybettik.", "b": "Sinyali yaklaşık on dakika önce kaybettik.", "a_is": "dubzar"}, {"id": 28, "category": "konusma", "context": "", "en": "I didn't sign up for this.", "a": "Bunun için kayıt yaptırmadım.", "b": "Ben buna razı olmamıştım.", "a_is": "dubzar"}, {"id": 29, "category": "argo", "context": "", "en": "Don't be such a baby about it.", "a": "Bu konuda bebek gibi davranma.", "b": "Bu konuda bebek gibi davranma.", "a_is": "dubzar"}, {"id": 30, "category": "argo", "context": "", "en": "That punk owes me five grand.", "a": "O serserinin bana beş bin borcu var.", "b": "O serseri bana beş bin borçlu.", "a_is": "dubzar"}, {"id": 31, "category": "argo", "context": "", "en": "Get the hell out of my car.", "a": "Defol arabamdan.", "b": "Arabamdan defol git.", "a_is": "claude"}, {"id": 32, "category": "argo", "context": "", "en": "I'm not about to let some wannabe push me around.", "a": "İsteyen birinin beni itip kakmasına izin vermeyeceğim.", "b": "Bir özenti herifin beni itip kakmasına izin verecek değilim.", "a_is": "dubzar"}, {"id": 33, "category": "argo", "context": "", "en": "You're dead meat, pal.", "a": "Sen öldün dostum.", "b": "Sen bittin, ahbap.", "a_is": "dubzar"}, {"id": 34, "category": "argo", "context": "", "en": "What's your damage?", "a": "Zararın ne?", "b": "Senin derdin ne?", "a_is": "dubzar"}, {"id": 35, "category": "argo", "context": "", "en": "He's a total sleazebag.", "a": "Tam bir pislik.", "b": "Tam bir pislik herif.", "a_is": "dubzar"}, {"id": 36, "category": "argo", "context": "", "en": "Cut the crap and tell me where it is.", "a": "Saçmalamayı kes ve nerede olduğunu söyle.", "b": "Saçmalamayı kes ve nerede olduğunu söyle.", "a_is": "dubzar"}, {"id": 37, "category": "argo", "context": "", "en": "She ratted us out, man.", "a": "Bizi ispiyonladı, dostum.", "b": "Bizi gammazladı, dostum.", "a_is": "claude"}, {"id": 38, "category": "argo", "context": "", "en": "That car's a piece of junk.", "a": "O araba bir hurda.", "b": "O araba bir hurda parçası.", "a_is": "claude"}, {"id": 39, "category": "argo", "context": "", "en": "I'm so wasted right now.", "a": "Şu an leş gibiyim.", "b": "Şu an çok sarhoşum.", "a_is": "claude"}, {"id": 40, "category": "argo", "context": "", "en": "Stop being such a drama queen.", "a": "Drama kraliçesi gibi davranmayı bırak.", "b": "Şu abartıyı bırak artık.", "a_is": "dubzar"}, {"id": 41, "category": "argo", "context": "", "en": "Beat it, kid. Before I lose my patience.", "a": "Defol, evlat. Sabrım taşmadan.", "b": "Bas git, evlat. Sabrımı kaybetmeden önce.", "a_is": "claude"}, {"id": 42, "category": "argo", "context": "", "en": "He got jumped outside the bar last night.", "a": "Dün gece bardan atlamış.", "b": "Dün gece barın önünde adama pusu kurdular.", "a_is": "dubzar"}, {"id": 43, "category": "argo", "context": "", "en": "You're really starting to tick me off.", "a": "Beni gerçekten sinirlendirmeye başladın.", "b": "Beni gerçekten sinirlendirmeye başladın.", "a_is": "dubzar"}, {"id": 44, "category": "argo", "context": "", "en": "No dice. The deal's off.", "a": "Olmaz. Anlaşma iptal.", "b": "Zar yok. Anlaşma iptal.", "a_is": "claude"}, {"id": 45, "category": "argo", "context": "", "en": "Quit stalling and open the safe.", "a": "Oyalanmayı bırak ve kasayı aç.", "b": "Oyalanmayı bırak da kasayı aç.", "a_is": "dubzar"}, {"id": 46, "category": "argo", "context": "", "en": "She's a real ball-buster.", "a": "Gerçek bir top avcısı.", "b": "O tam bir baş belası.", "a_is": "dubzar"}, {"id": 47, "category": "gorev", "context": "", "en": "Follow the red van without being spotted.", "a": "Kırmızı minibüsü fark edilmeden takip et.", "b": "Kırmızı minibüsü fark edilmeden takip edin.", "a_is": "claude"}, {"id": 48, "category": "gorev", "context": "", "en": "Find a way into the control room.", "a": "Kontrol odasına girmenin bir yolunu bul.", "b": "Kontrol odasına girmenin bir yolunu bul.", "a_is": "dubzar"}, {"id": 49, "category": "gorev", "context": "", "en": "Collect three samples from the lab.", "a": "Laboratuvardan üç örnek alın.", "b": "Laboratuvardan üç numune topla.", "a_is": "dubzar"}, {"id": 50, "category": "gorev", "context": "", "en": "Rescue the hostages before the timer expires.", "a": "Zamanlayıcı süresi dolmadan rehineleri kurtarın.", "b": "Süre dolmadan rehineleri kurtar.", "a_is": "dubzar"}, {"id": 51, "category": "gorev", "context": "", "en": "Disable the security cameras.", "a": "Güvenlik kameralarını devre dışı bırak.", "b": "Güvenlik kameralarını devre dışı bırak.", "a_is": "claude"}, {"id": 52, "category": "gorev", "context": "", "en": "Reach the rooftop and signal the helicopter.", "a": "Çatıya ulaş ve helikoptere sinyal ver.", "b": "Çatıya çık ve helikoptere işaret ver.", "a_is": "dubzar"}, {"id": 53, "category": "gorev", "context": "", "en": "Talk to the mechanic about the engine.", "a": "Motor hakkında tamirciyle konuş.", "b": "Tamirciyle motor hakkında konuş.", "a_is": "claude"}, {"id": 54, "category": "gorev", "context": "", "en": "Capture the enemy outpost.", "a": "Düşman karakolunu ele geçirin.", "b": "Düşman karakolunu ele geçir.", "a_is": "dubzar"}, {"id": 55, "category": "gorev", "context": "", "en": "Optional: Find all hidden packages.", "a": "İsteğe bağlı: Gizli paketlerin hepsini bul.", "b": "İsteğe bağlı: Tüm gizli paketleri bulun.", "a_is": "claude"}, {"id": 56, "category": "gorev", "context": "", "en": "Objective updated: Escort the scientist to safety.", "a": "Amaç güncellendi: Bilim adamına güvenli bir şekilde eşlik edin.", "b": "Görev güncellendi: Bilim insanını güvenli bir yere ulaştır.", "a_is": "dubzar"}, {"id": 57, "category": "arayuz", "context": "", "en": "Press F to interact.", "a": "Etkileşim için F tuşuna bas.", "b": "Etkileşim için F tuşuna bas.", "a_is": "dubzar"}, {"id": 58, "category": "arayuz", "context": "", "en": "Hold Shift to sprint.", "a": "Sprint için Shift tuşuna basılı tut.", "b": "Koşmak için Shift tuşuna basılı tut.", "a_is": "dubzar"}, {"id": 59, "category": "arayuz", "context": "", "en": "Not enough money.", "a": "Yeterli para yok.", "b": "Yeterli para yok.", "a_is": "dubzar"}, {"id": 60, "category": "arayuz", "context": "", "en": "Weapon wheel: Select a weapon.", "a": "Silah çarkı: Bir silah seçin.", "b": "Silah çarkı: Bir silah seç.", "a_is": "dubzar"}, {"id": 61, "category": "arayuz", "context": "", "en": "Your game has been saved.", "a": "Oyunun kaydedildi.", "b": "Oyununuz kurtarıldı.", "a_is": "claude"}, {"id": 62, "category": "arayuz", "context": "", "en": "Your vehicle is damaged.", "a": "Aracınız hasar gördü.", "b": "Aracın hasar gördü.", "a_is": "dubzar"}, {"id": 63, "category": "arayuz", "context": "", "en": "Settings: Audio, Video, Controls", "a": "Ayarlar: Ses, Video, Kontroller", "b": "Ayarlar: Ses, Görüntü, Kontroller", "a_is": "dubzar"}, {"id": 64, "category": "arayuz", "context": "", "en": "Mission complete. Reward: $500", "a": "Görev tamamlandı. Ödül: 500 $", "b": "Görev tamamlandı. Ödül: 500 $", "a_is": "dubzar"}, {"id": 65, "category": "resmi", "context": "", "en": "The empire will rise again, mark my words.", "a": "İmparatorluk yeniden yükselecek, sözlerimi yaz.", "b": "İmparatorluk yeniden yükselecek, sözlerimi unutma.", "a_is": "dubzar"}, {"id": 66, "category": "resmi", "context": "", "en": "You stand accused of treason against the crown.", "a": "Taca karşı vatana ihanetle suçlanıyorsun.", "b": "Tacına ihanetle suçlanıyorsun.", "a_is": "claude"}, {"id": 67, "category": "resmi", "context": "", "en": "Long live the king!", "a": "Çok yaşa kral!", "b": "Yaşasın kral!", "a_is": "dubzar"}, {"id": 68, "category": "resmi", "context": "", "en": "The ancient seals are breaking one by one.", "a": "Eski mühürler teker teker kırılıyor.", "b": "Kadim mühürler tek tek kırılıyor.", "a_is": "dubzar"}, {"id": 69, "category": "resmi", "context": "", "en": "Honored guests, please take your seats.", "a": "Saygıdeğer misafirler, lütfen yerlerinize oturun.", "b": "Sayın misafirler, lütfen yerlerinizi alın.", "a_is": "dubzar"}, {"id": 70, "category": "resmi", "context": "", "en": "Our ship will reach orbit in ten minutes.", "a": "Gemimiz 10 dakika içinde yörüngeye ulaşacak.", "b": "Gemimiz on dakika içinde yörüngeye ulaşacak.", "a_is": "dubzar"}, {"id": 71, "category": "resmi", "context": "", "en": "The storm has been raging for three days.", "a": "Fırtına üç gündür devam ediyor.", "b": "Fırtına üç gündür dinmeden sürüyor.", "a_is": "dubzar"}, {"id": 72, "category": "resmi", "context": "", "en": "A great evil stirs beneath the mountain.", "a": "Dağın altında büyük bir kötülük karışır.", "b": "Dağın altında büyük bir kötülük kıpırdanıyor.", "a_is": "dubzar"}, {"id": 73, "category": "resmi", "context": "", "en": "By my oath, I will see this through.", "a": "Yemin ederim ki, bu işi bitireceğim.", "b": "Yeminim olsun ki bunu sonuna kadar götüreceğim.", "a_is": "dubzar"}, {"id": 74, "category": "resmi", "context": "", "en": "Dr. Hayes, please report to the control deck.", "a": "Dr. Hayes, lütfen kontrol güvertesine gelin.", "b": "Dr. Hayes, lütfen kontrol güvertesine gelin.", "a_is": "claude"}, {"id": 75, "category": "kisa", "context": "", "en": "Incoming!", "a": "Geliyor!", "b": "Geliyor!", "a_is": "dubzar"}, {"id": 76, "category": "kisa", "context": "", "en": "Reloading!", "a": "Şarjör değiştiriyorum!", "b": "Dolduruyorum!", "a_is": "claude"}, {"id": 77, "category": "kisa", "context": "", "en": "Clear!", "a": "Temiz!", "b": "Temiz!", "a_is": "dubzar"}, {"id": 78, "category": "kisa", "context": "", "en": "Target down.", "a": "Hedef vuruldu.", "b": "Hedef vuruldu.", "a_is": "dubzar"}, {"id": 79, "category": "kisa", "context": "", "en": "Fall back!", "a": "Geri çekilin!", "b": "Geri çekilin!", "a_is": "dubzar"}, {"id": 80, "category": "kisa", "context": "", "en": "Take cover!", "a": "Siper alın!", "b": "Siper al!", "a_is": "dubzar"}, {"id": 81, "category": "kisa", "context": "", "en": "Let's go!", "a": "Haydi gidelim!", "b": "Hadi gidelim!", "a_is": "dubzar"}, {"id": 82, "category": "kisa", "context": "", "en": "Don't shoot!", "a": "Ateş etmeyin!", "b": "Ateş etme!", "a_is": "dubzar"}, {"id": 83, "category": "baglam", "context": "They took her to the docks.", "en": "Which one?", "a": "Hangi rıhtıma?", "b": "Hangisini?", "a_is": "claude"}, {"id": 84, "category": "baglam", "context": "Did you find the key?", "en": "Not yet. Give me a minute.", "a": "Daha değil. Bana bir dakika ver.", "b": "Henüz değil. Bana bir dakika ver.", "a_is": "dubzar"}, {"id": 85, "category": "baglam", "context": "He's wearing a red jacket.", "en": "That's him.", "a": "İşte o.", "b": "Bu o.", "a_is": "claude"}, {"id": 86, "category": "baglam", "context": "Be careful with the glass.", "en": "I know. I've got it.", "a": "Farkındayım. Ben hallederim.", "b": "Biliyorum. Hallettim.", "a_is": "dubzar"}, {"id": 87, "category": "baglam", "context": "The bridge is out.", "en": "Then we go around.", "a": "O zaman etrafından dolaşırız.", "b": "Sonra da dolaşacağız.", "a_is": "claude"}, {"id": 88, "category": "baglam", "context": "Who's driving?", "en": "You are.", "a": "Sensin.", "b": "Öylesin.", "a_is": "claude"}, {"id": 89, "category": "baglam", "context": "I can't swim.", "en": "You don't have to.", "a": "Yüzmene gerek yok.", "b": "Buna gerek yok.", "a_is": "claude"}, {"id": 90, "category": "baglam", "context": "We need more time.", "en": "We don't have it.", "a": "Zamanımız yok.", "b": "Bizde yok.", "a_is": "claude"}];

const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch("/state");if(r.ok){const s=await r.json();if(s&&s.ratings)state=s}}catch(e){}
  if(!Object.keys(state.ratings).length){try{const l=JSON.parse(localStorage.getItem("rating")||"null");if(l)state=l}catch(e){}}
  render()}
let timer;function save(){localStorage.setItem("rating",JSON.stringify(state));clearTimeout(timer);timer=setTimeout(async()=>{try{await fetch("/save",{method:"POST",body:JSON.stringify({state,mapping:DATA.map(d=>({id:d.id,a_is:d.a_is,category:d.category,en:d.en,tr_dubzar:d.a_is=="dubzar"?d.a:d.b,tr_claude:d.a_is=="claude"?d.a:d.b}))})});$("#saved").textContent="kaydedildi"}catch(e){$("#saved").textContent="sunucuya kaydedilemedi (tarayıcıda duruyor)"}},300)}
function r(id){return state.ratings[id]=state.ratings[id]||{}}
function render(){
  const d=DATA[state.at],rt=r(d.id),done=DATA.filter(x=>{const q=state.ratings[x.id];return q&&q.a&&q.b}).length;
  $("#count").textContent=`${state.at+1} / ${DATA.length}  (puanlanan: ${done})`;$("#fill").style.width=100*done/DATA.length+"%";
  const card=(k,label)=>{const q=rt[k]||{};return `<div class="card"><h3>${label}</h3><div class="tr">${esc(d[k])}</div>
   <div class="btns">${[["ok","Düzgün"],["minor","Küçük sorun"],["bad","Ciddi hata"]].map(([v,t])=>`<button class="${v}${q.r==v?" on":""}" data-k="${k}" data-r="${v}">${t}</button>`).join("")}</div>
   <div class="why${q.r&&q.r!="ok"?" show":""}">${WHY.map(([v,t])=>`<button class="${(q.why||[]).includes(v)?"on":""}" data-k="${k}" data-w="${v}">${t}</button>`).join("")}</div></div>`};
  $("#item").innerHTML=`<span class="chip">${d.category}</span>${d.context?`<div class="ctx">Önceki satır: <b>${esc(d.context)}</b></div>`:""}
   <div class="en">${esc(d.en)}</div><div class="grid">${card("a","Çeviri A")}${card("b","Çeviri B")}</div>
   <div class="pref"><span>Hangisi daha iyi?</span>${[["a","A"],["eq","Eşit"],["b","B"]].map(([v,t])=>`<button class="${rt.pref==v?"on":""}" data-p="${v}">${t}</button>`).join("")}</div>
   <div class="nav"><button id="prev" ${state.at==0?"disabled":""}>← Önceki</button><button class="primary" id="next">${state.at==DATA.length-1?"Bitir":"Sonraki →"}</button></div>
   <p class="hint">"Düzgün": anlam doğru, doğal, üslup uygun. "Küçük sorun": anlaşılıyor ama kulağa yanlış geliyor. "Ciddi hata": anlam yanlış ya da saçma.</p>`;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=DATA[state.at],rt=r(d.id);
  if(t.dataset.r){const q=rt[t.dataset.k]=rt[t.dataset.k]||{};q.r=t.dataset.r;if(q.r=="ok")q.why=[];save();render()}
  else if(t.dataset.w){const q=rt[t.dataset.k];q.why=q.why||[];const i=q.why.indexOf(t.dataset.w);i<0?q.why.push(t.dataset.w):q.why.splice(i,1);save();render()}
  else if(t.dataset.p){rt.pref=t.dataset.p;save();render()}
  else if(t.id=="prev"){state.at--;save();render();scrollTo(0,0)}
  else if(t.id=="next"){if(state.at<DATA.length-1){state.at++;save();render();scrollTo(0,0)}else summary()}
  else if(t.id=="finish")summary()});
function summary(){
  const sys={dubzar:{ok:0,minor:0,bad:0,why:{},n:0},claude:{ok:0,minor:0,bad:0,why:{},n:0}},pref={dubzar:0,claude:0,eq:0},cat={};
  for(const d of DATA){const q=state.ratings[d.id];if(!q)continue;
    for(const k of ["a","b"]){const s=d.a_is==(k=="a"?"dubzar":"claude")||false;const who=(k=="a")?d.a_is:(d.a_is=="dubzar"?"claude":"dubzar");const x=q[k];if(!x||!x.r)continue;
      sys[who][x.r]++;sys[who].n++;(x.why||[]).forEach(w=>sys[who].why[w]=(sys[who].why[w]||0)+1);
      if(who=="dubzar"){cat[d.category]=cat[d.category]||{ok:0,minor:0,bad:0,n:0};cat[d.category][x.r]++;cat[d.category].n++}}
    if(q.pref){pref[q.pref=="eq"?"eq":(q.pref=="a"?d.a_is:(d.a_is=="dubzar"?"claude":"dubzar"))]++}}
  const pc=(v,n)=>n?Math.round(100*v/n)+"%":"-";const name={dubzar:"Dubzar (şimdiki)",claude:"Claude"};
  const whyName=Object.fromEntries(WHY);
  let h=`<h2>Sonuç</h2><table><tr><th></th><th>Puanlanan</th><th>Düzgün</th><th>Küçük sorun</th><th>Ciddi hata</th></tr>`+
   ["dubzar","claude"].map(k=>`<tr><td>${name[k]}</td><td>${sys[k].n}</td><td>${pc(sys[k].ok,sys[k].n)}</td><td>${pc(sys[k].minor,sys[k].n)}</td><td>${pc(sys[k].bad,sys[k].n)}</td></tr>`).join("")+`</table>`;
  h+=`<h2 style="margin-top:24px">Tercih</h2><p>Dubzar daha iyi: <b>${pref.dubzar}</b> · Eşit: <b>${pref.eq}</b> · Claude daha iyi: <b>${pref.claude}</b></p>`;
  h+=`<h2 style="margin-top:24px">Dubzar'ın sorun türleri</h2><p>${Object.entries(sys.dubzar.why).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${whyName[w]}: <b>${c}</b>`).join(" · ")||"-"}</p>`;
  h+=`<h2 style="margin-top:24px">Dubzar, türe göre</h2><table><tr><th>Tür</th><th>Düzgün</th><th>Küçük sorun</th><th>Ciddi hata</th></tr>`+Object.entries(cat).map(([c,v])=>`<tr><td>${c}</td><td>${pc(v.ok,v.n)}</td><td>${pc(v.minor,v.n)}</td><td>${pc(v.bad,v.n)}</td></tr>`).join("")+`</table>`;
  $("#item").style.display="none";$("#result").style.display="block";$("#result").innerHTML=h+`<div class="nav"><button id="back">← Geri dön</button></div>`;
  $("#back").onclick=()=>{$("#result").style.display="none";$("#item").style.display="block";render()};scrollTo(0,0)}
load();
</script></body></html>
