<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çeviri puanlama (kısa kontrol)</title>
<style>
:root{--bg:#231f1b;--surface:#352F2A;--line:#4A423B;--text:#F7F5F0;--muted:#A89F94;--accent:#F2C14E;--ink:#2B2622;--ok:#7fe0b0;--minor:#F2C14E;--bad:#ff8f8f}
*{box-sizing:border-box;margin:0}body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:5}
header .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:760px;margin:10px auto 0}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:24px 20px 80px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ctx{margin-top:14px;color:var(--muted);font-size:15px}.ctx b{color:var(--text);font-weight:500}
.en{font-size:26px;font-weight:500;margin:10px 0 18px;line-height:1.25}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.tr{font-size:24px;margin:0 0 16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}button.on.minor{background:var(--minor);color:var(--ink);border-color:var(--minor)}button.on.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.why{margin-top:12px;display:none;flex-wrap:wrap;gap:6px}.why.show{display:flex}.why button{font-size:13px;padding:5px 12px}.why button.on{background:var(--line)}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}.nav .primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin-top:8px}.saved{font-size:12px;color:var(--muted)}
#result{display:none;margin-top:30px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--muted);font-weight:500;font-size:13px}
</style></head><body>
<header><div class="row"><b>Kısa kontrol</b><span id="count"></span><span class="saved" id="saved"></span><button id="finish">Sonuçları göster</button></div><div class="bar"><i id="fill"></i></div></header>
<main><div id="item"></div><div id="result"></div></main>
<script>
const DATA=[{"id": 1122, "category": "resmi", "context": "", "en": "The messenger was the bearer of bad news.", "tr": "Haberi getiren kişi kötü haberciydi."}, {"id": 1138, "category": "deyim1", "context": "", "en": "Get your act together, or we lose.", "tr": "Toparlan artık, yoksa kaybederiz."}, {"id": 5291, "category": "deyim2", "context": "", "en": "Let bygones be bygones.", "tr": "Geçmiş geçmişte kals."}, {"id": 5197, "category": "resmi", "context": "", "en": "The enemy would not give an inch.", "tr": "Düşman bir santim bile vermezdi."}, {"id": 1023, "category": "deyim2", "context": "", "en": "He ate his words.", "tr": "Sözünü çiğnedi."}, {"id": 1022, "category": "deyim1", "context": "", "en": "Steady as she goes, boys.", "tr": "İstikrarı bozmayın çocuklar."}, {"id": 1039, "category": "gorev", "context": "", "en": "Trade your furs for supplies at the post.", "tr": "Postanede kürklerini erzakla takas et."}, {"id": 5153, "category": "resmi", "context": "", "en": "The council made a mountain out of a molehill.", "tr": "Konsey köstebek yuvasından bir dağ yaptı."}, {"id": 1001, "category": "resmi", "context": "", "en": "Let sleeping dogs lie, my friend.", "tr": "Uyuyan köpeği uyandırma dostum."}, {"id": 1132, "category": "argo2", "context": "", "en": "I'll bring my A-game tonight.", "tr": "Bu gece elimden gelenin en iyisini yapacağım."}, {"id": 5173, "category": "deyim1", "context": "", "en": "Put your money where your mouth is.", "tr": "Paranı ağzının olduğu yere koy."}, {"id": 1032, "category": "deyim2", "context": "", "en": "He hit me below the belt.", "tr": "Bana çamur attı."}, {"id": 5003, "category": "resmi", "context": "", "en": "Let sleeping dogs lie, my friend.", "tr": "Uyuyan köpekler yalan söylesin dostum."}, {"id": 1024, "category": "deyim2", "context": "", "en": "A stitch in time saves nine.", "tr": "Zamanında alınan önlem, sonradan büyük işlere yol açmaz."}, {"id": 5167, "category": "argo2", "context": "", "en": "The race is going to come down to the wire.", "tr": "Yarış tellere kadar inecek."}, {"id": 5273, "category": "argo1", "context": "", "en": "Dude, you're so extra.", "tr": "Dostum, çok ekstrasın."}, {"id": 1145, "category": "deyim2", "context": "", "en": "Let bygones be bygones.", "tr": "Geçmişi geçmişte bırakalım."}, {"id": 5265, "category": "argo2", "context": "", "en": "I'll bring my A-game tonight.", "tr": "Bu gece A-oyunumu getireceğim."}, {"id": 5005, "category": "deyim1", "context": "", "en": "Speak of the devil, here he comes.", "tr": "Şeytandan bahsetmişken, işte geliyor."}, {"id": 1067, "category": "deyim2", "context": "", "en": "He's lost his marbles.", "tr": "Çıldırmış bu adam."}, {"id": 5111, "category": "argo2", "context": "", "en": "The accountant cooked the books for years before anyone noticed.", "tr": "Muhasebeci, kimse fark etmeden yıllarca kitapları pişirdi."}, {"id": 5089, "category": "gorev", "context": "", "en": "Make a run for the truck on my count.", "tr": "Benim sayemde kamyon için bir koşu yap."}, {"id": 5061, "category": "deyim1", "context": "", "en": "Better luck next time, rookie.", "tr": "Bir dahaki sefere iyi şanslar çaylak."}, {"id": 5099, "category": "deyim2", "context": "", "en": "I'm shaking like a leaf.", "tr": "Yaprak gibi titriyorum."}, {"id": 5079, "category": "gorev", "context": "", "en": "Trade your furs for supplies at the post.", "tr": "Posttaki malzemelerle kürklerinizi takas edin."}, {"id": 5049, "category": "deyim2", "context": "", "en": "A stitch in time saves nine.", "tr": "Zamanla yapılan bir dikiş 9'u kurtarır."}, {"id": 5215, "category": "argo2", "context": "", "en": "The fight was fixed, and everyone knew it.", "tr": "Mücadele sabitti ve herkes bunu biliyordu."}, {"id": 1090, "category": "argo1", "context": "", "en": "Shoot, I plum forgot.", "tr": "Hay aksi, tamamen aklımdan çıkmış."}, {"id": 1015, "category": "argo1", "context": "", "en": "He got what was coming to him.", "tr": "Hak etti."}, {"id": 5045, "category": "deyim1", "context": "", "en": "Steady as she goes, boys.", "tr": "Devam edin çocuklar."}, {"id": 1049, "category": "deyim2", "context": "", "en": "I'm shaking like a leaf.", "tr": "İçim içime sığmıyor, titremekten ölüyorum."}, {"id": 1025, "category": "gorev", "context": "", "en": "Bandage the wound to stop the bleeding.", "tr": "Kanamanın durması için yarayı sar."}, {"id": 5245, "category": "resmi", "context": "", "en": "The messenger was the bearer of bad news.", "tr": "Peygamber, kötü haber getirenlerdendi."}, {"id": 1055, "category": "argo2", "context": "", "en": "The accountant cooked the books for years before anyone noticed.", "tr": "Muhasebeci kimse fark etmeden yıllarca defterleri karaladı."}, {"id": 1104, "category": "argo2", "context": "", "en": "Keep your enemies close and your friends closer.", "tr": "Düşmanını yakın tut, dostunu daha yakın."}, {"id": 5031, "category": "argo1", "context": "", "en": "He got what was coming to him.", "tr": "Ona gelen şeyi aldı."}, {"id": 5165, "category": "argo1", "context": "", "en": "Look at this guy, all swagger and no brains.", "tr": "Şu herife bak, her tarafı kundakçı ve beyni yok."}, {"id": 5065, "category": "deyim2", "context": "", "en": "He hit me below the belt.", "tr": "Kemerin altına vurdu."}, {"id": 1002, "category": "deyim1", "context": "", "en": "Speak of the devil, here he comes.", "tr": "Nazar değmesin, işte geldi."}, {"id": 1044, "category": "gorev", "context": "", "en": "Make a run for the truck on my count.", "tr": "Ben \"başla\" deyince kamyona doğru koş."}, {"id": 5277, "category": "deyim1", "context": "", "en": "Get your act together, or we lose.", "tr": "Rolünü yap yoksa kaybederiz."}, {"id": 1086, "category": "deyim1", "context": "", "en": "Put your money where your mouth is.", "tr": "Boş konuşma, icraata geç."}, {"id": 1083, "category": "argo2", "context": "", "en": "The race is going to come down to the wire.", "tr": "Yarış son ana kadar kafa kafaya gidecek."}, {"id": 1088, "category": "gorev", "context": "", "en": "Lay low until the heat dies down.", "tr": "Ortalık sakinleşene kadar sakın."}, {"id": 5155, "category": "deyim1", "context": "", "en": "Don't get your hopes up.", "tr": "Umudunu kaybetme."}, {"id": 5051, "category": "gorev", "context": "", "en": "Bandage the wound to stop the bleeding.", "tr": "Kanamayı durdurmak için yarayı yaralayın."}, {"id": 5047, "category": "deyim2", "context": "", "en": "He ate his words.", "tr": "Onun sözlerini yedi."}, {"id": 1077, "category": "deyim1", "context": "", "en": "Don't get your hopes up.", "tr": "Çok ümitlenme."}, {"id": 1030, "category": "deyim1", "context": "", "en": "Better luck next time, rookie.", "tr": "Bir dahaki sefere artık, çaylak."}, {"id": 1098, "category": "resmi", "context": "", "en": "The enemy would not give an inch.", "tr": "Düşman adım atmadı."}, {"id": 1082, "category": "argo1", "context": "", "en": "Look at this guy, all swagger and no brains.", "tr": "Şu tipe bak, boş boş hava atıyor ama kılıfı yok."}, {"id": 5209, "category": "argo2", "context": "", "en": "Keep your enemies close and your friends closer.", "tr": "Düşmanlarınızı ve arkadaşlarınızı yakın tutun."}, {"id": 1076, "category": "resmi", "context": "", "en": "The council made a mountain out of a molehill.", "tr": "Konseyin yaptığı şey, samanlıkta saman aramak gibiydi."}, {"id": 5135, "category": "deyim2", "context": "", "en": "He's lost his marbles.", "tr": "Mermerlerini kaybetti."}, {"id": 5009, "category": "resmi", "context": "", "en": "Let us not squabble while the kingdom burns.", "tr": "Krallık yanarken kavga etmeyelim."}, {"id": 5181, "category": "argo1", "context": "", "en": "Shoot, I plum forgot.", "tr": "Kahretsin, erik unuttum."}, {"id": 1136, "category": "argo1", "context": "", "en": "Dude, you're so extra.", "tr": "Oğlum, amma abartıyorsun ya."}, {"id": 5177, "category": "gorev", "context": "", "en": "Lay low until the heat dies down.", "tr": "Sıcaklık düşene kadar eğilin."}, {"id": 1004, "category": "resmi", "context": "", "en": "Let us not squabble while the kingdom burns.", "tr": "Krallık yanarken birbirimizi yiyelim."}, {"id": 1107, "category": "argo2", "context": "", "en": "The fight was fixed, and everyone knew it.", "tr": "Dövüş ayarlanmıştı, herkes de bunu biliyordu."}];
const WHY=[["meaning","Anlam yanlış"],["natural","Doğal değil"],["register","Üslup (sen/siz, argo)"],["term","Oyun terimi"],["name","İsim"],["missing","Eksik ya da fazla"]];
let state={ratings:{},at:0};const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch("/state");if(r.ok){const s=await r.json();if(s&&s.ratings&&Object.keys(s.ratings).length)state=s}}catch(e){}
  if(!Object.keys(state.ratings).length){try{const l=JSON.parse(localStorage.getItem("rating_spot")||"null");if(l)state=l}catch(e){}}render()}
let timer;function save(){localStorage.setItem("rating_spot",JSON.stringify(state));clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch("/save",{method:"POST",body:JSON.stringify({state,mapping:DATA})});if(!r.ok)throw 0;$("#saved").textContent="kaydedildi"}catch(e){$("#saved").textContent="SUNUCUYA KAYDEDİLEMEDİ: sunucu kapanmış olabilir, Claude'a söyle"}},300)}
function r(id){return state.ratings[id]=state.ratings[id]||{}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){const d=DATA[state.at],q=r(d.id),done=DATA.filter(x=>state.ratings[x.id]&&state.ratings[x.id].r).length;
  $("#count").textContent=`${state.at+1} / ${DATA.length}  (puanlanan: ${done})`;$("#fill").style.width=100*done/DATA.length+"%";
  $("#item").innerHTML=`<span class="chip">${d.category}</span>${d.context?`<div class="ctx">Önceki satır: <b>${esc(d.context)}</b></div>`:""}
  <div class="en">${esc(d.en)}</div><div class="card"><div class="tr">${esc(d.tr)}</div>
  <div class="btns">${[["ok","Düzgün"],["minor","Küçük sorun"],["bad","Ciddi hata"]].map(([v,t])=>`<button class="${v}${q.r==v?" on":""}" data-r="${v}">${t}</button>`).join("")}</div>
  <div class="why${q.r&&q.r!="ok"?" show":""}">${WHY.map(([v,t])=>`<button class="${(q.why||[]).includes(v)?"on":""}" data-w="${v}">${t}</button>`).join("")}</div></div>
  <div class="nav"><button id="prev" ${state.at==0?"disabled":""}>← Önceki</button><button class="primary" id="next">${state.at==DATA.length-1?"Bitir":"Sonraki →"}</button></div>
  <p class="hint">"Düzgün": anlam doğru, doğal, üslup uygun. "Küçük sorun": anlaşılıyor ama kulağa yanlış geliyor. "Ciddi hata": anlam yanlış ya da saçma.</p>`}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=DATA[state.at],q=r(d.id);
  if(t.dataset.r){q.r=t.dataset.r;if(q.r=="ok")q.why=[];save();render()}
  else if(t.dataset.w){q.why=q.why||[];const i=q.why.indexOf(t.dataset.w);i<0?q.why.push(t.dataset.w):q.why.splice(i,1);save();render()}
  else if(t.id=="prev"){state.at--;save();render();scrollTo(0,0)}
  else if(t.id=="next"){if(state.at<DATA.length-1){state.at++;save();render();scrollTo(0,0)}else summary()}
  else if(t.id=="finish")summary()});
function summary(){const tot={ok:0,minor:0,bad:0,n:0},why={},cat={};
  for(const d of DATA){const q=state.ratings[d.id];if(!q||!q.r)continue;tot[q.r]++;tot.n++;(q.why||[]).forEach(w=>why[w]=(why[w]||0)+1);cat[d.category]=cat[d.category]||{ok:0,minor:0,bad:0,n:0};cat[d.category][q.r]++;cat[d.category].n++}
  const pc=(v,n)=>n?Math.round(100*v/n)+"%":"-",wn=Object.fromEntries(WHY);
  $("#item").style.display="none";$("#result").style.display="block";
  $("#result").innerHTML=`<h2>Sonuç</h2><p>Puanlanan: <b>${tot.n}</b> · Düzgün: <b>${pc(tot.ok,tot.n)}</b> · Küçük sorun: <b>${pc(tot.minor,tot.n)}</b> · Ciddi hata: <b>${pc(tot.bad,tot.n)}</b></p>
  <p style="margin-top:10px">${Object.entries(why).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${wn[w]}: <b>${c}</b>`).join(" · ")}</p>
  <table><tr><th>Tür</th><th>Düzgün</th><th>Küçük sorun</th><th>Ciddi hata</th></tr>${Object.entries(cat).map(([c,v])=>`<tr><td>${c}</td><td>${pc(v.ok,v.n)}</td><td>${pc(v.minor,v.n)}</td><td>${pc(v.bad,v.n)}</td></tr>`).join("")}</table>
  <div class="nav"><button id="back">← Geri dön</button></div>`;
  $("#back").onclick=()=>{$("#result").style.display="none";$("#item").style.display="block";render()};scrollTo(0,0)}
load();
</script></body></html>
