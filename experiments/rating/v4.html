<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çeviri puanlama (ince ayarlı model)</title>
<style>
:root{--bg:#231f1b;--surface:#352F2A;--line:#4A423B;--text:#F7F5F0;--muted:#A89F94;--accent:#F2C14E;--ink:#2B2622;--ok:#7fe0b0;--minor:#F2C14E;--bad:#ff8f8f}
*{box-sizing:border-box;margin:0}body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:5}
header .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:760px;margin:10px auto 0}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:24px 20px 80px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ctx{margin-top:14px;color:var(--muted);font-size:15px}.ctx b{color:var(--text);font-weight:500}
.en{font-size:26px;font-weight:500;margin:10px 0 18px;line-height:1.25}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.tr{font-size:24px;margin:0 0 16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}button.on.minor{background:var(--minor);color:var(--ink);border-color:var(--minor)}button.on.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.why{margin-top:12px;display:none;flex-wrap:wrap;gap:6px}.why.show{display:flex}.why button{font-size:13px;padding:5px 12px}.why button.on{background:var(--line)}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}.nav .primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin-top:8px}.saved{font-size:12px;color:var(--muted)}
#result{display:none;margin-top:30px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--muted);font-weight:500;font-size:13px}
</style></head><body>
<header><div class="row"><b>İnce ayarlı model</b><span id="count"></span><span class="saved" id="saved"></span><button id="finish">Sonuçları göster</button></div><div class="bar"><i id="fill"></i></div></header>
<main><div id="item"></div><div id="result"></div></main>
<script>
const DATA=[{"id": 3, "category": "konusma", "context": "", "en": "We've got about five minutes before they notice.", "tr": "Fark etmeden önce beş dakikamız var."}, {"id": 6, "category": "konusma", "context": "", "en": "Whatever happens, stay close to me.", "tr": "Ne olursa olsun bana yakın dur."}, {"id": 8, "category": "konusma", "context": "", "en": "That doesn't sound like him at all.", "tr": "Bu hiç de onun yapacağı bir şey değil."}, {"id": 11, "category": "konusma", "context": "", "en": "I thought we agreed to meet at noon.", "tr": "Öğlen buluşmaya karar verdiğimizi sanıyordum."}, {"id": 13, "category": "konusma", "context": "", "en": "I don't have time for riddles.", "tr": "Bilmecelere ayıracak vaktim yok."}, {"id": 17, "category": "konusma", "context": "", "en": "Nobody has been in this room for years.", "tr": "Yıllardır bu odaya kimse girmedi."}, {"id": 27, "category": "konusma", "context": "", "en": "Was there anyone with you?", "tr": "Yanında biri var mıydı?"}, {"id": 31, "category": "konusma", "context": "", "en": "You look like you've seen a ghost.", "tr": "Bir hayalet görmüş gibi görünüyorsun."}, {"id": 33, "category": "konusma", "context": "", "en": "I told them everything I knew.", "tr": "Onlara bildiğim her şeyi söyledim."}, {"id": 34, "category": "konusma", "context": "", "en": "Is that really the best you can do?", "tr": "Elinden gelenin en iyisi bu mu gerçekten?"}, {"id": 37, "category": "argo", "context": "", "en": "That dude's got a screw loose.", "tr": "O herifin işi bitti."}, {"id": 39, "category": "argo", "context": "", "en": "She's been giving me the cold shoulder all week.", "tr": "Bütün hafta bana soğuk davrandı."}, {"id": 40, "category": "argo", "context": "", "en": "Get off my back, will you?", "tr": "Çekil üstümden, tamam mı?"}, {"id": 41, "category": "argo", "context": "", "en": "You're full of it, and you know it.", "tr": "Doydun ve biliyorsun."}, {"id": 42, "category": "argo", "context": "", "en": "He's all talk and no action.", "tr": "Hep konuşur, hiçbir şey yapmaz."}, {"id": 43, "category": "argo", "context": "", "en": "Don't try to sweet-talk me.", "tr": "Benimle tatlı dille konuşmaya çalışma."}, {"id": 48, "category": "argo", "context": "", "en": "She's out of her league and she knows it.", "tr": "O artık kendinde değil ve bunu biliyor."}, {"id": 50, "category": "argo", "context": "", "en": "You think I was born yesterday?", "tr": "Dün doğduğumu mu sanıyorsun?"}, {"id": 51, "category": "argo", "context": "", "en": "Man, this place gives me the creeps.", "tr": "Abi, burası beni ürpertiyor."}, {"id": 52, "category": "argo", "context": "", "en": "He kicked the bucket last winter.", "tr": "Geçen kış işi bitirmişti."}, {"id": 53, "category": "argo", "context": "", "en": "Nice try, hotshot.", "tr": "İyi denemeydi, usta."}, {"id": 54, "category": "argo", "context": "", "en": "I'll be damned if I let you take the credit.", "tr": "Krediyi senin almana izin verirsem lanetlenirim."}, {"id": 55, "category": "argo", "context": "", "en": "That's a load of garbage and you know it.", "tr": "Bu tam bir çöplük ve sen de biliyorsun."}, {"id": 58, "category": "argo", "context": "", "en": "This whole thing stinks.", "tr": "Bu şey berbat."}, {"id": 60, "category": "argo", "context": "", "en": "You got some guts showing up here.", "tr": "Buraya gelmeye cesaretin var."}, {"id": 62, "category": "argo", "context": "", "en": "Quit your whining and move it.", "tr": "Sızlanmayı bırak da kımılda."}, {"id": 63, "category": "argo", "context": "", "en": "They were wasted before noon.", "tr": "Öğleden önce harcandılar."}, {"id": 64, "category": "argo", "context": "", "en": "Talk about bad luck, huh?", "tr": "Kötü şanstan bahsediyorsun, ha?"}, {"id": 65, "category": "argo", "context": "", "en": "That's a rip-off and you know it.", "tr": "Bu tam bir kazık ve sen de biliyorsun."}, {"id": 67, "category": "argo", "context": "", "en": "You're a total pushover.", "tr": "Tam bir rüşvetçisin."}, {"id": 70, "category": "argo", "context": "", "en": "He's loaded, but he's cheap as hell.", "tr": "Zengin ama çok ucuz."}, {"id": 72, "category": "argo", "context": "", "en": "Man, you're a lifesaver.", "tr": "Abi, sen hayat kurtarıcısın."}, {"id": 76, "category": "gorev", "context": "", "en": "Sneak past the guards and reach the vault.", "tr": "Muhafızların yanından gizlice geç ve kasaya ulaş."}, {"id": 77, "category": "gorev", "context": "", "en": "Gather information from the locals.", "tr": "Yerlilerden bilgi topla."}, {"id": 78, "category": "gorev", "context": "", "en": "Escort the convoy to the border.", "tr": "Konvoyu sınıra kadar götür."}, {"id": 79, "category": "gorev", "context": "", "en": "Destroy the supply truck before it leaves.", "tr": "Teçhizat kamyonu çıkmadan yok et."}, {"id": 84, "category": "gorev", "context": "", "en": "Lure the guards away from the entrance.", "tr": "Muhafızları girişten uzaklaştır."}, {"id": 89, "category": "gorev", "context": "", "en": "Hide in the cargo hold until the ship docks.", "tr": "Gemi yanana kadar kargo deposunda saklan."}, {"id": 94, "category": "gorev", "context": "", "en": "Craft a torch to light the tunnel.", "tr": "Tüneli yakmak için bir meşale yap."}, {"id": 96, "category": "gorev", "context": "", "en": "Bribe the dock worker for information.", "tr": "Rıhtım görevlisine rüşvet ver, bilgi al."}, {"id": 97, "category": "gorev", "context": "", "en": "Mission objective: Reach the evacuation zone.", "tr": "Görev hedefi: Tahliye bölgesine ulaş."}, {"id": 98, "category": "gorev", "context": "", "en": "New quest: The Lost Heir.", "tr": "Yeni görev: Kayıp Kahraman."}, {"id": 100, "category": "gorev", "context": "", "en": "Tip: Use stealth to avoid combat.", "tr": "İpucu: Çatışmayı önlemek için gizlilik kullan."}, {"id": 103, "category": "arayuz", "context": "", "en": "Press Tab to open your inventory.", "tr": "Envanterini açmak için Tab tuşuna bas."}, {"id": 109, "category": "arayuz", "context": "", "en": "Save failed. Please try again.", "tr": "Kaydetme başarısız. Lütfen bir daha dene."}, {"id": 114, "category": "arayuz", "context": "", "en": "Weapon broken.", "tr": "Silah kırık."}, {"id": 117, "category": "arayuz", "context": "", "en": "New item acquired: Rusty Key", "tr": "Yeni eşya alındı: Paslı anahtar"}, {"id": 118, "category": "arayuz", "context": "", "en": "Press Esc to pause the game.", "tr": "Oyunu duraklatmak için Esc'e bas."}, {"id": 127, "category": "arayuz", "context": "", "en": "Brightness: 70%", "tr": "Parlaklık: %70"}, {"id": 128, "category": "arayuz", "context": "", "en": "Controls: Keyboard and Mouse", "tr": "Kontroller: Klavye ve fare"}, {"id": 132, "category": "arayuz", "context": "", "en": "Fuel: 40%", "tr": "Yakıt: %40"}, {"id": 142, "category": "resmi", "context": "", "en": "Let it be known that the crown forgives no traitor.", "tr": "Herkes bilmelidir ki taç haini affetmez."}, {"id": 144, "category": "resmi", "context": "", "en": "The old kingdom lies buried beneath the sand.", "tr": "Eski krallık kumun altında gömülü."}, {"id": 145, "category": "resmi", "context": "", "en": "Our scouts report movement along the northern ridge.", "tr": "Keşif ekiplerimiz kuzey sırtında hareket olduğunu bildirdi."}, {"id": 151, "category": "resmi", "context": "", "en": "A sacrifice is demanded by the ancient law.", "tr": "Kadim kanun tarafından bir fedakârlık talep ediliyor."}, {"id": 152, "category": "resmi", "context": "", "en": "The signal originates from deep within the asteroid belt.", "tr": "Sinyal, asteroit kuşağının derinliklerinden geliyor."}, {"id": 154, "category": "resmi", "context": "", "en": "The prince has vanished without a trace.", "tr": "Prens hiçbir iz bırakmadan ortadan kayboldu."}, {"id": 160, "category": "resmi", "context": "", "en": "The oracle speaks in riddles, but her words are true.", "tr": "Kâhin bilmecelerle konuşuyor ama sözleri doğru."}, {"id": 162, "category": "resmi", "context": "", "en": "The archives were sealed over a century ago.", "tr": "Arşivler yüz yıl önce mühürlüydü."}, {"id": 163, "category": "resmi", "context": "", "en": "Fortune favors the bold.", "tr": "Talih cesurlardan yanadır."}, {"id": 164, "category": "resmi", "context": "", "en": "The tournament will begin at first light.", "tr": "Turnuva ilk ışıkla başlayacak."}, {"id": 166, "category": "resmi", "context": "", "en": "By decree of the emperor, this city is under quarantine.", "tr": "İmparatorun fermanıyla bu şehir karantina altında."}, {"id": 182, "category": "kisa", "context": "", "en": "I'm out of ammo!", "tr": "Mermin bitti!"}, {"id": 187, "category": "baglam", "context": "Is the car ready?", "en": "Almost. It needs fuel.", "tr": "Neredeyse. Yakıt lazım."}, {"id": 194, "category": "baglam", "context": "The guards change shifts at midnight.", "en": "That gives us ten minutes.", "tr": "Bu bize on dakika veriyor."}];
const WHY=[["meaning","Anlam yanlış"],["natural","Doğal değil"],["register","Üslup (sen/siz, argo)"],["term","Oyun terimi"],["name","İsim"],["missing","Eksik ya da fazla"]];
let state={ratings:{},at:0};const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch("/state");if(r.ok){const s=await r.json();if(s&&s.ratings&&Object.keys(s.ratings).length)state=s}}catch(e){}
  if(!Object.keys(state.ratings).length){try{const l=JSON.parse(localStorage.getItem("rating_v4")||"null");if(l)state=l}catch(e){}}render()}
let timer;function save(){localStorage.setItem("rating_v4",JSON.stringify(state));clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch("/save",{method:"POST",body:JSON.stringify({state,mapping:DATA})});if(!r.ok)throw 0;$("#saved").textContent="kaydedildi"}catch(e){$("#saved").textContent="SUNUCUYA KAYDEDİLEMEDİ: sunucu kapanmış olabilir, Claude'a söyle"}},300)}
function r(id){return state.ratings[id]=state.ratings[id]||{}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){const d=DATA[state.at],q=r(d.id),done=DATA.filter(x=>state.ratings[x.id]&&state.ratings[x.id].r).length;
  $("#count").textContent=`${state.at+1} / ${DATA.length}  (puanlanan: ${done})`;$("#fill").style.width=100*done/DATA.length+"%";
  $("#item").innerHTML=`<span class="chip">${d.category}</span>${d.context?`<div class="ctx">Önceki satır: <b>${esc(d.context)}</b></div>`:""}
  <div class="en">${esc(d.en)}</div><div class="card"><div class="tr">${esc(d.tr)}</div>
  <div class="btns">${[["ok","Düzgün"],["minor","Küçük sorun"],["bad","Ciddi hata"]].map(([v,t])=>`<button class="${v}${q.r==v?" on":""}" data-r="${v}">${t}</button>`).join("")}</div>
  <div class="why${q.r&&q.r!="ok"?" show":""}">${WHY.map(([v,t])=>`<button class="${(q.why||[]).includes(v)?"on":""}" data-w="${v}">${t}</button>`).join("")}</div></div>
  <div class="nav"><button id="prev" ${state.at==0?"disabled":""}>← Önceki</button><button class="primary" id="next">${state.at==DATA.length-1?"Bitir":"Sonraki →"}</button></div>
  <p class="hint">"Düzgün": anlam doğru, doğal, üslup uygun. "Küçük sorun": anlaşılıyor ama kulağa yanlış geliyor. "Ciddi hata": anlam yanlış ya da saçma.</p>`}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=DATA[state.at],q=r(d.id);
  if(t.dataset.r){q.r=t.dataset.r;if(q.r=="ok")q.why=[];save();render()}
  else if(t.dataset.w){q.why=q.why||[];const i=q.why.indexOf(t.dataset.w);i<0?q.why.push(t.dataset.w):q.why.splice(i,1);save();render()}
  else if(t.id=="prev"){state.at--;save();render();scrollTo(0,0)}
  else if(t.id=="next"){if(state.at<DATA.length-1){state.at++;save();render();scrollTo(0,0)}else summary()}
  else if(t.id=="finish")summary()});
function summary(){const tot={ok:0,minor:0,bad:0,n:0},why={},cat={};
  for(const d of DATA){const q=state.ratings[d.id];if(!q||!q.r)continue;tot[q.r]++;tot.n++;(q.why||[]).forEach(w=>why[w]=(why[w]||0)+1);cat[d.category]=cat[d.category]||{ok:0,minor:0,bad:0,n:0};cat[d.category][q.r]++;cat[d.category].n++}
  const pc=(v,n)=>n?Math.round(100*v/n)+"%":"-",wn=Object.fromEntries(WHY);
  $("#item").style.display="none";$("#result").style.display="block";
  $("#result").innerHTML=`<h2>Sonuç</h2><p>Puanlanan: <b>${tot.n}</b> · Düzgün: <b>${pc(tot.ok,tot.n)}</b> · Küçük sorun: <b>${pc(tot.minor,tot.n)}</b> · Ciddi hata: <b>${pc(tot.bad,tot.n)}</b></p>
  <p style="margin-top:10px">${Object.entries(why).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${wn[w]}: <b>${c}</b>`).join(" · ")}</p>
  <table><tr><th>Tür</th><th>Düzgün</th><th>Küçük sorun</th><th>Ciddi hata</th></tr>${Object.entries(cat).map(([c,v])=>`<tr><td>${c}</td><td>${pc(v.ok,v.n)}</td><td>${pc(v.minor,v.n)}</td><td>${pc(v.bad,v.n)}</td></tr>`).join("")}</table>
  <div class="nav"><button id="back">← Geri dön</button></div>`;
  $("#back").onclick=()=>{$("#result").style.display="none";$("#item").style.display="block";render()};scrollTo(0,0)}
load();
</script></body></html>
