<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çeviri puanlama (ikinci model)</title>
<style>
:root{--bg:#231f1b;--surface:#352F2A;--line:#4A423B;--text:#F7F5F0;--muted:#A89F94;--accent:#F2C14E;--ink:#2B2622;--ok:#7fe0b0;--minor:#F2C14E;--bad:#ff8f8f}
*{box-sizing:border-box;margin:0}body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;z-index:5}
header .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:760px;margin:10px auto 0}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:24px 20px 80px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ctx{margin-top:14px;color:var(--muted);font-size:15px}.ctx b{color:var(--text);font-weight:500}
.en{font-size:26px;font-weight:500;margin:10px 0 18px;line-height:1.25}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.tr{font-size:24px;margin:0 0 16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}button.on.minor{background:var(--minor);color:var(--ink);border-color:var(--minor)}button.on.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.why{margin-top:12px;display:none;flex-wrap:wrap;gap:6px}.why.show{display:flex}.why button{font-size:13px;padding:5px 12px}.why button.on{background:var(--line)}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}.nav .primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin-top:8px}.saved{font-size:12px;color:var(--muted)}
#result{display:none;margin-top:30px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--muted);font-weight:500;font-size:13px}
</style></head><body>
<header><div class="row"><b>İkinci model</b><span id="count"></span><span class="saved" id="saved"></span><button id="finish">Sonuçları göster</button></div><div class="bar"><i id="fill"></i></div></header>
<main><div id="item"></div><div id="result"></div></main>
<script>
const DATA=[{"id": 3, "category": "konusma", "context": "", "en": "We've got about five minutes before they notice.", "tr": "Fark edeceklerinden önce yaklaşık beş dakikaımız var."}, {"id": 8, "category": "konusma", "context": "", "en": "That doesn't sound like him at all.", "tr": "Bu, onun sesi gibi değil."}, {"id": 11, "category": "konusma", "context": "", "en": "I thought we agreed to meet at noon.", "tr": "Öğlen saatinde buluşmakta anlaştığımızı sanıyordum."}, {"id": 17, "category": "konusma", "context": "", "en": "Nobody has been in this room for years.", "tr": "Yıllardır kimse bu odada bulunmamıştır."}, {"id": 25, "category": "konusma", "context": "", "en": "You can't just walk away from this.", "tr": "Bundan sadece uzaklaşamazsınız."}, {"id": 32, "category": "konusma", "context": "", "en": "We're running low on supplies.", "tr": "Malzeme stoklarımız azalıyor."}, {"id": 34, "category": "konusma", "context": "", "en": "Is that really the best you can do?", "tr": "Bu gerçekten yapabileceğiniz en iyisi mi?"}, {"id": 36, "category": "argo", "context": "", "en": "Stop acting like a clown and listen up.", "tr": "Palyaço gibi davranmayı bırakın ve dinleyin."}, {"id": 37, "category": "argo", "context": "", "en": "That dude's got a screw loose.", "tr": "O adamın bir sorunu var."}, {"id": 38, "category": "argo", "context": "", "en": "I'm gonna wipe that smirk right off your face.", "tr": "Yüzündeki o gülümsemeyi silip atacağım."}, {"id": 39, "category": "argo", "context": "", "en": "She's been giving me the cold shoulder all week.", "tr": "Tüm hafta boyunca bana soğuk davranıyor."}, {"id": 40, "category": "argo", "context": "", "en": "Get off my back, will you?", "tr": "Sırtımı yormayın, olur mu?"}, {"id": 41, "category": "argo", "context": "", "en": "You're full of it, and you know it.", "tr": "Bundan dolayısın ve bunu biliyorsun."}, {"id": 42, "category": "argo", "context": "", "en": "He's all talk and no action.", "tr": "Sadece konuşuyor, hiçbir eylemde bulunmuyor."}, {"id": 43, "category": "argo", "context": "", "en": "Don't try to sweet-talk me.", "tr": "Bana tatlı sözler söylemeye çalışma."}, {"id": 44, "category": "argo", "context": "", "en": "We got played, man. Big time.", "tr": "Yenildik, dostum. Çok büyük bir yenilgi."}, {"id": 45, "category": "argo", "context": "", "en": "That guy is a snake in the grass.", "tr": "O adam, otların arasındaki bir yılan."}, {"id": 47, "category": "argo", "context": "", "en": "Hand over the cash or things get ugly.", "tr": "Nakit parayı verin, yoksa durum kötüleşir."}, {"id": 48, "category": "argo", "context": "", "en": "She's out of her league and she knows it.", "tr": "O, onun seviyesinin dışında ve bunu biliyor."}, {"id": 49, "category": "argo", "context": "", "en": "What a bunch of lowlifes.", "tr": "Ne kadar kötü insanlar."}, {"id": 51, "category": "argo", "context": "", "en": "Man, this place gives me the creeps.", "tr": "Aman, bu yer beni ürkütüyor."}, {"id": 54, "category": "argo", "context": "", "en": "I'll be damned if I let you take the credit.", "tr": "Sana bu ödülü vermeme asla izin vermeyeceğim."}, {"id": 55, "category": "argo", "context": "", "en": "That's a load of garbage and you know it.", "tr": "Bu tam bir saçmalık ve bunu biliyorsunuz."}, {"id": 56, "category": "argo", "context": "", "en": "Don't you dare flake on me again.", "tr": "Bir daha bana gelme."}, {"id": 57, "category": "argo", "context": "", "en": "He's been dodging me like the plague.", "tr": "Beni tıpkı bir veba gibi kaçınıyor."}, {"id": 60, "category": "argo", "context": "", "en": "You got some guts showing up here.", "tr": "Buraya gelmek için biraz cesaretin var."}, {"id": 61, "category": "argo", "context": "", "en": "She dumped him on the spot.", "tr": "Onu oracıkta terk etti."}, {"id": 62, "category": "argo", "context": "", "en": "Quit your whining and move it.", "tr": "Şikayet etmeyi bırak ve harekete geç."}, {"id": 63, "category": "argo", "context": "", "en": "They were wasted before noon.", "tr": "Öğlenden önce boşa harcandılar."}, {"id": 64, "category": "argo", "context": "", "en": "Talk about bad luck, huh?", "tr": "Şanssızlık hakkında konuşuyoruz, değil mi?"}, {"id": 65, "category": "argo", "context": "", "en": "That's a rip-off and you know it.", "tr": "Bu bir dolandırıcılık, bunu biliyorsunuz."}, {"id": 67, "category": "argo", "context": "", "en": "You're a total pushover.", "tr": "Tamamen kolayca yenilebilir birisiniz."}, {"id": 68, "category": "argo", "context": "", "en": "The cops were all over us.", "tr": "Polisler her yerdeydi."}, {"id": 69, "category": "argo", "context": "", "en": "Take a hike, pal.", "tr": "Git başka bir yere, dostum."}, {"id": 70, "category": "argo", "context": "", "en": "He's loaded, but he's cheap as hell.", "tr": "Çok güçlü, ama aynı zamanda çok ucuz."}, {"id": 71, "category": "argo", "context": "", "en": "Spill it, or I'll make you.", "tr": "Söyle, yoksa seni cezalandıracağım."}, {"id": 72, "category": "argo", "context": "", "en": "Man, you're a lifesaver.", "tr": "Aman, sen gerçekten bir kurtarıcısın."}, {"id": 73, "category": "argo", "context": "", "en": "We're toast if they find us here.", "tr": "Eğer bizi burada bulurlarsa mahvoluruz."}, {"id": 76, "category": "gorev", "context": "", "en": "Sneak past the guards and reach the vault.", "tr": "Nöbetçilerin yanından süzülerek kasaya ulaşın."}, {"id": 79, "category": "gorev", "context": "", "en": "Destroy the supply truck before it leaves.", "tr": "Teslimat kamyonu ayrılmadan önce yok edin."}, {"id": 82, "category": "gorev", "context": "", "en": "Return to the camp and report to the captain.", "tr": "Kampa geri dönün ve kaptana rapor verin."}, {"id": 84, "category": "gorev", "context": "", "en": "Lure the guards away from the entrance.", "tr": "Nöbetçileri girişten uzaklaştırın."}, {"id": 85, "category": "gorev", "context": "", "en": "Reach the next checkpoint within two minutes.", "tr": "İki dakika içinde bir sonraki kontrol noktasına ulaşın."}, {"id": 86, "category": "gorev", "context": "", "en": "Defeat the boss to unlock the gate.", "tr": "Boss’u yendikten sonra kapıyı açabilirsiniz."}, {"id": 87, "category": "gorev", "context": "", "en": "Search the ruins for ancient artifacts.", "tr": "Harabelerde eski eserler arayın."}, {"id": 88, "category": "gorev", "context": "", "en": "Deliver the medicine to the village.", "tr": "İlaçı köye teslim edin."}, {"id": 89, "category": "gorev", "context": "", "en": "Hide in the cargo hold until the ship docks.", "tr": "Geminin limana yanaşmasını bekleyerek kargo bölmesinde saklanın."}, {"id": 90, "category": "gorev", "context": "", "en": "Plant the explosives on the bridge supports.", "tr": "Patlayıcıları köprü desteklerine yerleştirin."}, {"id": 94, "category": "gorev", "context": "", "en": "Craft a torch to light the tunnel.", "tr": "Tüneli aydınlatmak için bir meşale yapın."}, {"id": 96, "category": "gorev", "context": "", "en": "Bribe the dock worker for information.", "tr": "Demiryolu işçisinden bilgi almak için rüşvet verin."}, {"id": 98, "category": "gorev", "context": "", "en": "New quest: The Lost Heir.", "tr": "Yeni görev: Kayıp Varis"}, {"id": 100, "category": "gorev", "context": "", "en": "Tip: Use stealth to avoid combat.", "tr": "İpucu: Savaştan kaçınmak için gizlilik kullanın."}, {"id": 102, "category": "arayuz", "context": "", "en": "Hold Space to charge your jump.", "tr": "Atlamanızı yapmak için yer açın."}, {"id": 103, "category": "arayuz", "context": "", "en": "Press Tab to open your inventory.", "tr": "Envanterinizi açmak için Tab tuşuna basın."}, {"id": 117, "category": "arayuz", "context": "", "en": "New item acquired: Rusty Key", "tr": "Yeni öğe edinildi: Rusty Key"}, {"id": 123, "category": "arayuz", "context": "", "en": "Invert Y-Axis", "tr": "Y eksenini tersine çevirin"}, {"id": 130, "category": "arayuz", "context": "", "en": "Chapter 3: The Long Way Home", "tr": "3. Bölüm: Uzun Yol Evine"}, {"id": 135, "category": "arayuz", "context": "", "en": "Hold Left Click to aim.", "tr": "Hedefi belirlemek için sol tıklayın."}, {"id": 141, "category": "resmi", "context": "", "en": "The council has spoken, and its word is final.", "tr": "Konsey karar verdi ve onun sözü kesindir."}, {"id": 142, "category": "resmi", "context": "", "en": "Let it be known that the crown forgives no traitor.", "tr": "Taçın hainleri affetmediği bilinsin."}, {"id": 143, "category": "resmi", "context": "", "en": "Many have fallen in defense of these walls.", "tr": "Birçok kişi bu duvarları savunmak için canını verdi."}, {"id": 144, "category": "resmi", "context": "", "en": "The old kingdom lies buried beneath the sand.", "tr": "Eski krallık kumların altında gömülü."}, {"id": 145, "category": "resmi", "context": "", "en": "Our scouts report movement along the northern ridge.", "tr": "Keşif birliklerimiz, kuzey sırtında hareketlilik olduğunu bildiriyor."}, {"id": 147, "category": "resmi", "context": "", "en": "I pledge my sword to your cause.", "tr": "Kılıcımı sizin amacınıza adarım."}, {"id": 148, "category": "resmi", "context": "", "en": "Only the worthy may pass through these gates.", "tr": "Sadece değerli olanlar bu kapılardan geçebilir."}, {"id": 149, "category": "resmi", "context": "", "en": "The captain's log: day forty-two at sea.", "tr": "Kaptanın günlüğü: Denizdeki kırk ikinci gün."}, {"id": 150, "category": "resmi", "context": "", "en": "Citizens of the republic, tonight we stand together.", "tr": "Cumhuriyetin vatandaşları, bu gece birlikteyiz."}, {"id": 151, "category": "resmi", "context": "", "en": "A sacrifice is demanded by the ancient law.", "tr": "Eski yasalar gereği bir kurban sunulmalıdır."}, {"id": 152, "category": "resmi", "context": "", "en": "The signal originates from deep within the asteroid belt.", "tr": "Sinyal, asteroit kuşağının derinliklerinden geliyor."}, {"id": 153, "category": "resmi", "context": "", "en": "All hands, brace for impact.", "tr": "Herkes, darbeye hazırlanın."}, {"id": 156, "category": "resmi", "context": "", "en": "May the light guide you through the darkness.", "tr": "Işık, sizi karanlıkta yönlendirsin."}, {"id": 157, "category": "resmi", "context": "", "en": "We regret to inform you that the contract has been terminated.", "tr": "Sözleşmenin sonlandırıldığını bildirmekten üzgünüz."}, {"id": 160, "category": "resmi", "context": "", "en": "The oracle speaks in riddles, but her words are true.", "tr": "Kehanetçi bilmecelerle konuşur, ancak sözleri doğrudur."}, {"id": 162, "category": "resmi", "context": "", "en": "The archives were sealed over a century ago.", "tr": "Arşivler bir yüzyıl önce mühürlenmiştir."}, {"id": 163, "category": "resmi", "context": "", "en": "Fortune favors the bold.", "tr": "Kader cesur olanları destekler."}, {"id": 166, "category": "resmi", "context": "", "en": "By decree of the emperor, this city is under quarantine.", "tr": "İmparatorun emriyle bu şehir karantina altında."}, {"id": 168, "category": "resmi", "context": "", "en": "The mission is classified. You will not discuss it.", "tr": "Görev gizlidır. Bu konuda hiçbir şey konuşmayacaksınız."}, {"id": 170, "category": "resmi", "context": "", "en": "The bells toll for those we have lost.", "tr": "Kaybettiğimiz insanlar için çanlar çalıyor."}, {"id": 194, "category": "baglam", "context": "The guards change shifts at midnight.", "en": "That gives us ten minutes.", "tr": "Bu bize on dakika veriyor."}, {"id": 196, "category": "baglam", "context": "They have the whole street blocked.", "en": "Then we go through the alley.", "tr": "Sonra sokağı geçeriz."}];
const WHY=[["meaning","Anlam yanlış"],["natural","Doğal değil"],["register","Üslup (sen/siz, argo)"],["term","Oyun terimi"],["name","İsim"],["missing","Eksik ya da fazla"]];
let state={ratings:{},at:0};const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch("/state");if(r.ok){const s=await r.json();if(s&&s.ratings&&Object.keys(s.ratings).length)state=s}}catch(e){}
  if(!Object.keys(state.ratings).length){try{const l=JSON.parse(localStorage.getItem("rating_hybrid")||"null");if(l)state=l}catch(e){}}render()}
let timer;function save(){localStorage.setItem("rating_hybrid",JSON.stringify(state));clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch("/save",{method:"POST",body:JSON.stringify({state,mapping:DATA})});if(!r.ok)throw 0;$("#saved").textContent="kaydedildi"}catch(e){$("#saved").textContent="SUNUCUYA KAYDEDİLEMEDİ: sunucu kapanmış olabilir, Claude'a söyle"}},300)}
function r(id){return state.ratings[id]=state.ratings[id]||{}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){const d=DATA[state.at],q=r(d.id),done=DATA.filter(x=>state.ratings[x.id]&&state.ratings[x.id].r).length;
  $("#count").textContent=`${state.at+1} / ${DATA.length}  (puanlanan: ${done})`;$("#fill").style.width=100*done/DATA.length+"%";
  $("#item").innerHTML=`<span class="chip">${d.category}</span>${d.context?`<div class="ctx">Önceki satır: <b>${esc(d.context)}</b></div>`:""}
  <div class="en">${esc(d.en)}</div><div class="card"><div class="tr">${esc(d.tr)}</div>
  <div class="btns">${[["ok","Düzgün"],["minor","Küçük sorun"],["bad","Ciddi hata"]].map(([v,t])=>`<button class="${v}${q.r==v?" on":""}" data-r="${v}">${t}</button>`).join("")}</div>
  <div class="why${q.r&&q.r!="ok"?" show":""}">${WHY.map(([v,t])=>`<button class="${(q.why||[]).includes(v)?"on":""}" data-w="${v}">${t}</button>`).join("")}</div></div>
  <div class="nav"><button id="prev" ${state.at==0?"disabled":""}>← Önceki</button><button class="primary" id="next">${state.at==DATA.length-1?"Bitir":"Sonraki →"}</button></div>
  <p class="hint">"Düzgün": anlam doğru, doğal, üslup uygun. "Küçük sorun": anlaşılıyor ama kulağa yanlış geliyor. "Ciddi hata": anlam yanlış ya da saçma.</p>`}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=DATA[state.at],q=r(d.id);
  if(t.dataset.r){q.r=t.dataset.r;if(q.r=="ok")q.why=[];save();render()}
  else if(t.dataset.w){q.why=q.why||[];const i=q.why.indexOf(t.dataset.w);i<0?q.why.push(t.dataset.w):q.why.splice(i,1);save();render()}
  else if(t.id=="prev"){state.at--;save();render();scrollTo(0,0)}
  else if(t.id=="next"){if(state.at<DATA.length-1){state.at++;save();render();scrollTo(0,0)}else summary()}
  else if(t.id=="finish")summary()});
function summary(){const tot={ok:0,minor:0,bad:0,n:0},why={},cat={};
  for(const d of DATA){const q=state.ratings[d.id];if(!q||!q.r)continue;tot[q.r]++;tot.n++;(q.why||[]).forEach(w=>why[w]=(why[w]||0)+1);cat[d.category]=cat[d.category]||{ok:0,minor:0,bad:0,n:0};cat[d.category][q.r]++;cat[d.category].n++}
  const pc=(v,n)=>n?Math.round(100*v/n)+"%":"-",wn=Object.fromEntries(WHY);
  $("#item").style.display="none";$("#result").style.display="block";
  $("#result").innerHTML=`<h2>Sonuç</h2><p>Puanlanan: <b>${tot.n}</b> · Düzgün: <b>${pc(tot.ok,tot.n)}</b> · Küçük sorun: <b>${pc(tot.minor,tot.n)}</b> · Ciddi hata: <b>${pc(tot.bad,tot.n)}</b></p>
  <p style="margin-top:10px">${Object.entries(why).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${wn[w]}: <b>${c}</b>`).join(" · ")}</p>
  <table><tr><th>Tür</th><th>Düzgün</th><th>Küçük sorun</th><th>Ciddi hata</th></tr>${Object.entries(cat).map(([c,v])=>`<tr><td>${c}</td><td>${pc(v.ok,v.n)}</td><td>${pc(v.minor,v.n)}</td><td>${pc(v.bad,v.n)}</td></tr>`).join("")}</table>
  <div class="nav"><button id="back">← Geri dön</button></div>`;
  $("#back").onclick=()=>{$("#result").style.display="none";$("#item").style.display="block";render()};scrollTo(0,0)}
load();
</script></body></html>
